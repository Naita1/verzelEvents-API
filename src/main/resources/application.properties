spring.application.name=verzel-events

# Configuração do Banco de Dados (Suporta Nuvem e Docker Local)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/eventos_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuração JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Secrets e Chaves
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000

app.tmdb.api-key=${TMDB_API_KEY}

app.qr.secret=${QR_SECRET}